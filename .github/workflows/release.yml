# Cuts a GitHub Release for a pushed `vX.Y.Z` tag and attaches the platform
# bundle (manifest.json, install.sh, its helper scripts, files/) as
# tools/build_platform_bundle.py produces it, plus a standalone
# manifest.json asset -- see doc/design/palmimo-app-platform.md 2.8
# (palmimo-devkit monorepo) for what consumes these (pi-gen's
# 05-app-platform stage and the Portal's platform-update job). The
# standalone manifest lets the Portal's frequent latest-version poll skip
# downloading the whole tarball.
#
# Mirrors palmimo-portal's release workflow: draft release (a maintainer
# reviews and publishes by hand), `--clobber` re-upload while still a
# draft, refuse to touch an already-published release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the tag points at a commit on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A pre-release tag (hyphenated) may point at a PR branch: it is
          # created as a draft pre-release, never becomes releases/latest,
          # and only devices opted into the prerelease channel see it.
          case "$TAG" in
            *-*) echo "pre-release tag $TAG: not required to be on main"; exit 0 ;;
          esac
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $TAG does not point at a commit on main" >&2
            exit 1
          fi

      - name: Guard against shipping platform/ content without a version bump
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Newest published, non-draft, non-prerelease release (excluding
          # this tag) that carries a bundle asset: only releases cut before
          # bundles existed lack one. `gh api` failing must fail this step
          # (set -e), not read as "no previous release". --paginate emits
          # one result per page (newest page first), so keep the first line;
          # sed reads to EOF so gh never sees a closed pipe under pipefail.
          prev_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '
            [.[] | select(.draft == false and .prerelease == false and .tag_name != env.TAG)]
            | sort_by(.published_at) | reverse
            | map(select(.assets | any(.name == ("palmimo-platform-" + .tag_name + ".tar.gz"))))
            | .[0].tag_name // empty
          ' | sed -n '1p')"
          if [ -z "$prev_tag" ]; then
            echo "no previous published release with a platform bundle asset found; skipping the platform version guard"
            exit 0
          fi
          echo "comparing against previous release $prev_tag"
          asset="palmimo-platform-${prev_tag}.tar.gz"
          gh release download "$prev_tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --output "/tmp/$asset"
          mkdir -p /tmp/prev-platform
          tar -xzf "/tmp/$asset" -C /tmp/prev-platform
          python3 tools/check_platform_version.py /tmp/prev-platform platform

      - name: Package the release asset
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          asset="palmimo-platform-${TAG}.tar.gz"
          manifest_asset="palmimo-platform-${TAG}.manifest.json"
          python3 tools/build_platform_bundle.py --out "$asset" --sha256-out "$asset.sha256" \
            --manifest-out "$manifest_asset" --manifest-sha256-out "$manifest_asset.sha256"

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          asset="palmimo-platform-${TAG}.tar.gz"
          manifest_asset="palmimo-platform-${TAG}.manifest.json"
          assets=("$asset" "$asset.sha256" "$manifest_asset" "$manifest_asset.sha256")
          # A hyphenated tag (v1.2.0-rc1, etc.) is a pre-release -- pass
          # --prerelease so it can never end up as `releases/latest` (what
          # every device's platform-update check queries) by a maintainer
          # forgetting to tick the box by hand when publishing the draft.
          prerelease_flag=()
          case "$TAG" in
            *-*) prerelease_flag=(--prerelease) ;;
          esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "release $TAG is already published; publish a new tag instead of replacing its assets" >&2
              exit 1
            fi
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "$TAG" \
              "${prerelease_flag[@]}" "${assets[@]}"
          fi
