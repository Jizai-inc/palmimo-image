# ALSA の既定デバイス。ReSpeaker（USB マイクアレイ + 3.5mm 出力）に固定する。
#
# 素の既定は card 0。出荷イメージでは HDMI がそこに来る起動があり、-D を
# 付けずに再生すると、配線が正しくてもスピーカーからは何も出ない
# （palmimo-image#9）。出方は表示器の有無で変わる —— 繋がっていれば音は
# HDMI へ流れて無音、繋がっていなければ再生がそもそも開けずに失敗する
# （2609-0001 の実測は後者で `audio open error: Unknown error 524`）。
#
# 番号ではなくカード名で固定する。ReSpeaker は 2 枚の HDMI に対する列挙順が
# 起動ごとに変わり、同一個体で card 0 / card 1 / card 2 を実測した。番号を
# 書くと次の再起動までしか正しくない。
#
# 行き先を sysdefault にしているのは、ALSA 自身のカード別既定チェーン
# （plug / dmix / USB-Audio の定義）をそのままこのカードへ移すため。
# hw や plughw を直接指すとミキシングが外れ、2 本目の再生が EBUSY になる。
#
# ★ defaults.pcm.card では書けない。あのキーは整数しか受け付けず、カード名を
#   渡すと alsa-lib が設定ファイルごと捨てる（"card is not a string" →
#   "may be old or corrupted"。2026-09-09 に 2609-0001 で実測）。番号を書けば
#   通るが、それでは起動ごとの列挙順に負ける。だからここは pcm.!default で書く。
#
# ReSpeaker が無い個体では、既定への再生は HDMI へ黙って流れる代わりに
# オープンに失敗する。起動時に既定を開くものは無く、デバイスを明示する
# 経路（plughw:CARD=... — SDK が解決するもの）は影響を受けない。
pcm.!default "sysdefault:CARD=ArrayUAC10"

ctl.!default {
    type hw
    card ArrayUAC10
}
